<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Scanner QR Pengawas | SIMUJIAN</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 18px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,.3);
    }

    .logo {
      font-size: 42px;
      margin-bottom: 8px;
    }

    h2 {
      margin: 8px 0;
      font-size: 23px;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.6;
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 12px;
      background: #0f172a;
      margin: 20px auto;
    }

    #status {
      background: #0f172a;
      border-radius: 10px;
      padding: 14px;
      margin-top: 16px;
      font-size: 14px;
      line-height: 1.5;
    }

    .success {
      color: #4ade80;
    }

    .error {
      color: #f87171;
    }

    .warning {
      color: #facc15;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      margin-top: 12px;
    }

    .btn-primary {
      background: #16a34a;
      color: white;
    }

    .btn-secondary {
      background: #475569;
      color: white;
    }

    footer {
      margin-top: 22px;
      font-size: 11px;
      color: #64748b;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="logo">📷</div>

  <h2>Scanner QR Pengawas</h2>

  <p class="subtitle">
    SIMUJIAN QR<br>
    SMK MA'ARIF NU JATIREJO
  </p>

  <div id="reader"></div>

  <div id="status">
    Menghubungkan ke Dashboard Panitia...
  </div>

  <button
    class="btn-secondary"
    onclick="tutupScanner()">
    TUTUP SCANNER
  </button>

  <footer>
    SIMUJIAN QR - Modul Absensi Pengawas
  </footer>

</div>

<script>

// ====================================
// KONFIGURASI
// ====================================

let DASHBOARD_ORIGIN = "";

let html5QrCode = null;
let scannerAktif = false;
let sedangMemproses = false;
let scannerSiap = false;


// ====================================
// KIRIM PESAN KE DASHBOARD
// ====================================

function kirimKeDashboard(data) {

  if (!window.opener || window.opener.closed) {
    tampilStatus("Dashboard Panitia tidak ditemukan.", "error");
    return;
  }

  window.opener.postMessage(
    data,
    DASHBOARD_ORIGIN || "*"
  );
}


// ====================================
// TAMPILAN STATUS
// ====================================

function tampilStatus(pesan, jenis = "") {

  const status = document.getElementById("status");

  status.textContent = pesan;
  status.className = jenis;
}


// ====================================
// MENERIMA PESAN DARI DASHBOARD
// ====================================


window.addEventListener("message", function(event) {

  // Pastikan pesan berasal dari jendela yang membuka scanner.
  if (event.source !== window.opener) return;

  const data = event.data || {};

  // Terima inisialisasi pertama dari Dashboard.
  if (data.type === "SIMUJIAN_PENGAWAS_INIT") {

    if (!DASHBOARD_ORIGIN) {
      DASHBOARD_ORIGIN = event.origin;
    }

    // Setelah origin dikenali, tolak origin lain.
    if (event.origin !== DASHBOARD_ORIGIN) return;

    if (scannerSiap) return;

    scannerSiap = true;

    tampilStatus(
      "Dashboard terhubung. Mengaktifkan kamera...",
      "warning"
    );

    mulaiScanner();
    return;
  }

  // Pesan berikutnya harus berasal dari origin Dashboard.
  if (
    !DASHBOARD_ORIGIN ||
    event.origin !== DASHBOARD_ORIGIN
  ) return;

  if (data.type === "SIMUJIAN_PENGAWAS_SCAN_RESULT") {

    sedangMemproses = false;

    const hasil = data.result || {};

    if (hasil.success) {

      tampilStatus(
        hasil.message ||
        "QR berhasil diterima. Silakan pilih jadwal dan ruang di Dashboard.",
        "success"
      );

    } else {

      tampilStatus(
        hasil.message || "QR tidak dapat diproses.",
        "error"
      );

    }
  }

});



// ====================================
// MULAI SCANNER
// ====================================

async function mulaiScanner() {

  if (scannerAktif || sedangMemproses) {
    return;
  }

  if (typeof Html5Qrcode === "undefined") {

    tampilStatus(
      "Library scanner gagal dimuat.",
      "error"
    );

    return;
  }

  try {

    if (!html5QrCode) {
      html5QrCode = new Html5Qrcode("reader");
    }

    await html5QrCode.start(

      { facingMode: "environment" },

      {
        fps: 10,
        qrbox: {
          width: 250,
          height: 250
        }
      },

      berhasilScan,

      function() {
        // Mengabaikan QR yang belum terbaca.
      }

    );

    scannerAktif = true;

    tampilStatus(
      "Kamera aktif. Arahkan ke QR Code guru pengawas.",
      "success"
    );

  } catch (error) {

    tampilStatus(
      "Kamera gagal diaktifkan: " + error,
      "error"
    );

  }

}


// ====================================
// HASIL PEMINDAIAN QR
// ====================================

async function berhasilScan(decodedText) {

  if (sedangMemproses) return;

  const tokenQR = String(decodedText || "").trim();

  if (!tokenQR || tokenQR.length > 200) {
    return;
  }

  sedangMemproses = true;

  tampilStatus(
    "QR terbaca. Mengirim data ke Dashboard Panitia...",
    "warning"
  );

  try {

    if (scannerAktif) {
      await html5QrCode.stop();
      scannerAktif = false;
    }

    kirimKeDashboard({

      type: "SIMUJIAN_PENGAWAS_QR_DECODED",

      tokenQR: tokenQR

    });

  } catch (error) {

    sedangMemproses = false;

    tampilStatus(
      "Gagal menghentikan kamera: " + error,
      "error"
    );

  }

}


// ====================================
// TUTUP SCANNER
// ====================================

async function tutupScanner() {

  try {

    if (html5QrCode && scannerAktif) {

      await html5QrCode.stop();

      scannerAktif = false;

    }

  } catch (error) {

    console.error(error);

  }

  if (window.opener && !window.opener.closed) {
    window.close();
  }

}


// ====================================
// LAPORAN SCANNER SIAP
// ====================================

window.addEventListener("load", function() {

  kirimKeDashboard({

    type: "SIMUJIAN_PENGAWAS_READY"

  });

});

</script>

</body>
</html>
